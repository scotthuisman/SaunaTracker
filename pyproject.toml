[project]
name = "sauna-fitness-guru"
version = "1.0.0"
description = "CSV-based sauna analytics and a grounded local Ollama analyst"
requires-python = ">=3.12,<3.15"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<3", "numpy>=2,<2.4", "plotly>=6,<7", "httpx>=0.28,<1", "python-dotenv>=1,<2", "tzdata>=2025.1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
